name: Android

on:
  push:
    branches: [main, codex/android]
    tags: ['android-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable release APK
        working-directory: android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon clean assembleRelease
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk
          mv android/app/build/outputs/apk/release/app-release.apk freetunnel-android.apk
          sha256sum freetunnel-android.apk > freetunnel-android.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: freetunnel-android
          path: |
            freetunnel-android.apk
            freetunnel-android.apk.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            freetunnel-android.apk
            freetunnel-android.apk.sha256
          generate_release_notes: true
